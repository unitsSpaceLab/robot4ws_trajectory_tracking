# Trajectory Tracking Parameters

# Speed limits
max_speed: 0.5
max_orientation_velocity: 0.5
max_acceleration: 0.5

# Pure pursuit
min_lookahead_distance: 0.25
max_lookahead_distance: 1.5
curvature_slowdown: 20.0

# Path processing
max_waypoint_spacing: 0.2
target_tolerance: 0.1

# PID gains - Velocity X
kp_dx: 1.0
kd_dx: 0.0
ki_dx: 0.0

# PID gains - Velocity Y
kp_dy: 1.0
kd_dy: 0.0
ki_dy: 0.0

# PID gains - Yaw
kp_dyaw: 0.07
kd_dyaw: 0.05
ki_dyaw: 0.0
